<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7b733"/>
      <stop offset="100%" stop-color="#c8710f"/>
    </linearGradient>
    <linearGradient id="glassTint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Glass body (nonic pint silhouette) -->
  <path d="M 17 7
           C 15 10, 14.5 13, 15.5 16
           C 14 19, 14 21, 15.5 23
           L 20 58
           Q 20 60.5 22.5 60.5
           L 41.5 60.5
           Q 44 60.5 44 58
           L 48.5 23
           C 50 21, 50 19, 48.5 16
           C 49.5 13, 49 10, 47 7
           Z"
        fill="#eaf6fb" fill-opacity="0.35" stroke="#33414a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Beer fill -->
  <path d="M 15 19
           Q 23 16 32 19 Q 41 22 49 19
           L 44 58
           Q 44 59.5 42 59.5
           L 22 59.5
           Q 20 59.5 20 58
           Z"
        fill="url(#beer)"/>

  <!-- A couple of small rising bubbles for texture -->
  <circle cx="26" cy="42" r="1.1" fill="#ffd77a" fill-opacity="0.8"/>
  <circle cx="37" cy="49" r="0.9" fill="#ffd77a" fill-opacity="0.8"/>
  <circle cx="30" cy="32" r="0.7" fill="#ffd77a" fill-opacity="0.7"/>

  <!-- Foam head, scalloped (a thinner cap than a full pour) -->
  <path d="M 15 19
           C 13.7 17, 13.7 15, 15 13
           C 14 11, 14.5 9, 16 7
           C 19 4, 23 9, 27 6
           C 31 3, 35 9, 39 6
           C 43 3, 46.5 8, 48 7
           C 49.5 9, 50 11, 49 13
           C 50.3 15, 50.3 17, 49 19
           Q 41 22 32 19
           Q 23 16 15 19
           Z"
        fill="#fff8ea" stroke="#33414a" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Glass highlight/shine -->
  <path d="M 17.5 10 C 16.5 22, 16.5 40, 18.5 55" fill="none" stroke="url(#glassTint)" stroke-width="3" stroke-linecap="round"/>

  <!-- PB monogram, centered on the glass -->
  <text x="32" y="39" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="700" font-size="17" fill="#4a2a0a" stroke="#ffe8b8" stroke-width="0.6"
        paint-order="stroke">PB</text>
</svg>
